[package]
name = "opennetbench"
version = "1.0.0-beta.1"
edition = "2021"
description = "Single-origin adversarial-load / network resilience assessment tool for authorized testing"
license = "GPL-3.0-or-later"
rust-version = "1.96"

[features]
# Off by default: enable on a Linux host with a supported NIC to build the
# AF_XDP line-rate transmit backend for the L4 vectors. The batched AF_PACKET
# fast path (sendmmsg) is always built — it needs no driver support.
xdp = []

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2"
httparse = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
h2 = "0.4"
http = "1"
pnet_packet = "0.35"
pnet_transport = "0.35"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "socks"] }
tokio-socks = "0.5"
rlimit = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
